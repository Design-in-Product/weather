name: Update rainfall site

# Hourly build of the rainfall dashboard. Fetches NOAA + IEM data, builds the
# static site under ./site/, deploys to GitHub Pages, and emails Xian if any
# newly completed day contains rain (set-diff against the previously deployed
# state.json fetched from the live site).
#
# Hourly 4am–11pm PST (5am–midnight PDT), per xian's 2026-10-15 cadence ruling;
# IEM rain is same-day, so a once-a-day build left the site a day behind.
# Off the top of the hour because GitHub delays :00 schedules the most.

on:
  schedule:
    - cron: '17 0-7,12-23 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch previous state from live Pages site
        # First run will 404; that's expected and detect_and_notify.py will
        # treat empty prev state as "first run" and skip the email.
        run: |
          mkdir -p prev
          PUBLIC_URL="https://weather.dinp.xyz"
          if curl -fsS -o prev/state.json "${PUBLIC_URL}/state.json"; then
            echo "Loaded previous state."
          else
            echo "No previous state at ${PUBLIC_URL}/state.json — first run."
            echo '{}' > prev/state.json
          fi

      - name: Build site
        run: python3 build_site.py

      - name: Detect fresh rain and notify
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          PUBLIC_URL: https://weather.dinp.xyz/
        run: python3 detect_and_notify.py prev/state.json site/state.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
